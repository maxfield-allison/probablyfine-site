worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/rss+xml;
    gzip_min_length 256;

    map $uri $cache_control {
        default                 "public, max-age=3600";
        ~*\.(css|js|woff2?)$    "public, max-age=31536000, immutable";
        ~*\.(png|jpg|jpeg|gif|svg|ico|webp)$ "public, max-age=604800";
        ~*\.html$               "public, max-age=0, must-revalidate";
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Never emit absolute redirects: behind a reverse proxy an absolute
        # Location would leak this origin's internal host and port.
        absolute_redirect off;
        port_in_redirect off;

        # Security headers.
        #
        # These were previously added only by Cloudflare, which meant anything
        # reaching this origin directly got a much weaker set. They are declared
        # here so the origin is safe on its own and the edge is defence in
        # depth. Where both set a header the browser enforces the intersection,
        # so these are written to agree with the edge rather than fight it.
        #
        # NOTE: nginx `add_header` is not additive across contexts. Any location
        # block that declares its own add_header drops every header inherited
        # from here, so such blocks must restate the full set. See /zeroday/.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # SAMEORIGIN rather than DENY: the edge already sends SAMEORIGIN, and
        # two different values across the chain is worse than one slightly
        # looser one. Real framing control comes from frame-ancestors below.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), vr=()" always;

        # Content-Security-Policy.
        #
        # script-src is 'self' plus giscus, which supplies blog comments: it
        # loads client.js and then renders the thread in an iframe, so it needs
        # both script-src and frame-src. Everything of mine is same-origin —
        # the one behavioural script lives at /js/read-tracker.js specifically
        # so no inline script is needed. If you add an inline <script> this
        # policy will block it; move the code to public/js/ instead of
        # weakening the policy.
        #
        # style-src needs 'unsafe-inline': Astro emits a small inline <style>
        # block and view transitions set inline style attributes, which cannot
        # be hashed. Inline style is a far weaker vector than inline script.
        # giscus is listed here too — it pulls giscus.app/default.css for the
        # comment widget, which a 'self'-only style-src blocks outright.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://giscus.app; style-src 'self' 'unsafe-inline' https://giscus.app; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://giscus.app; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

        add_header Cache-Control $cache_control;

        # The ZERO/DAY playtest build ships as a single self-contained HTML file
        # with an inline script. Rather than weaken script-src for the whole
        # site, this path gets its own policy. Every header is restated because
        # add_header in a location block discards the inherited set.
        location /zeroday/ {
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), vr=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
            add_header Cache-Control $cache_control;
            try_files $uri $uri/index.html =404;
        }

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Flat-file build: /blog serves /blog.html; /blog/<slug> serves the
        # nested file. Naming the file avoids the trailing-slash directory
        # redirect that would leak the origin behind a reverse proxy.
        location / {
            try_files $uri $uri.html $uri/index.html @notfound;
        }

        location @notfound {
            # no-store so a CDN never caches a negative response.
            add_header Cache-Control "no-store" always;
            return 404 /404.html;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
    }
}
