worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/rss+xml;
    gzip_min_length 256;

    map $uri $cache_control {
        default                 "public, max-age=3600";
        ~*\.(css|js|woff2?)$    "public, max-age=31536000, immutable";
        ~*\.(png|jpg|jpeg|gif|svg|ico|webp)$ "public, max-age=604800";
        ~*\.html$               "public, max-age=0, must-revalidate";
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Never emit absolute redirects: behind a reverse proxy an absolute
        # Location would leak this origin's internal host and port.
        absolute_redirect off;
        port_in_redirect off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control $cache_control;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Flat-file build: /blog serves /blog.html; /blog/<slug> serves the
        # nested file. Naming the file avoids the trailing-slash directory
        # redirect that would leak the origin behind a reverse proxy.
        location / {
            try_files $uri $uri.html $uri/index.html @notfound;
        }

        location @notfound {
            # no-store so a CDN never caches a negative response.
            add_header Cache-Control "no-store" always;
            return 404 /404.html;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
    }
}
