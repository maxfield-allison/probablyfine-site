worker_processes auto;
pid /run/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm;
    gzip_min_length 1024;
    map $uri $cache_control {
        default "public, max-age=3600";
        ~*\.(chunk|bin)$ "public, max-age=604800";
        ~*\.(html?|json)$ "public, max-age=0, must-revalidate";
    }
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        absolute_redirect off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        # This origin intentionally allows embedding by the blog. The generic
        # Traefik SAMEORIGIN middleware must not override these frame ancestors.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' 'unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob: data:; media-src 'self' blob:; font-src 'self' data:; frame-ancestors 'self' https://probablyfine.dev https://www.probablyfine.dev https://blog.probablyfine.dev; object-src 'none'; base-uri 'self'; form-action 'none'" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Service-Worker-Allowed "/" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control $cache_control;
        location = / { return 302 https://probablyfine.dev/arcade; }
        location = /healthz { access_log off; return 200 "ok\n"; }
        location = /embed { try_files /index.html =404; }
        location = /run { try_files /index.html =404; }
        location / { try_files $uri =404; }
    }
}
