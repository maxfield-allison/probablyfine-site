name: Arcade runtime image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile.arcade
      - arcade-nginx.conf
      - scripts/arcade/**
      - public/arcade/**
      - .github/workflows/arcade-image.yml
permissions:
  contents: read
  packages: write
concurrency:
  group: arcade-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.arcade
          push: true
          tags: |
            ghcr.io/maxfield-allison/probablyfine-site:arcade-${{ github.sha }}
          cache-from: type=gha,scope=arcade
          cache-to: type=gha,mode=max,scope=arcade
